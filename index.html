<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grocery List</title>
<meta name="theme-color" content="#1f6f4a">
<style>
  :root{--bg:#f6f7f5;--card:#fff;--text:#1d2420;--muted:#66706a;--accent:#1f6f4a;--accent-text:#fff;--line:#dde2de;--danger:#b3261e;--soft:#e8f2ec}
  @media (prefers-color-scheme:dark){:root{--bg:#121513;--card:#1b201d;--text:#e8ece9;--muted:#98a39c;--accent:#3fa874;--accent-text:#08150e;--line:#2b332e;--danger:#f2877f;--soft:#1f2b24}}
  *{box-sizing:border-box}
  body{margin:0;font:17px/1.35 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:76px}
  header{position:sticky;top:0;height:50px;background:var(--accent);color:var(--accent-text);padding:0 14px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  header h1{font-size:18px;margin:0}
  button{font:inherit;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--accent-text);font-weight:700}
  button.secondary{background:var(--soft);color:var(--text)}
  button.danger{background:var(--danger);color:#fff}
  button.link{background:none;color:inherit;padding:4px 8px;font-weight:400;text-decoration:underline;font-size:14px}
  button:disabled{opacity:.5}
  .full{width:100%}
  main{max-width:680px;margin:0 auto}
  .filters{position:sticky;top:50px;background:var(--bg);z-index:9;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
  .filters input{width:100%;padding:12px;font-size:17px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500;font-size:15px}
  .chip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .list{padding:4px 12px}
  .cat{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 2px 6px}
  .p{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
  .p.in{background:var(--soft);border-color:var(--accent)}
  .p .body{flex:1;min-width:0}
  .p .name{font-weight:600}
  .p .hint{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p .note{font-size:14px;margin-top:2px}
  .addbtn{min-width:74px}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:42px;padding:10px 0;background:var(--card);color:var(--text);border:1px solid var(--line);font-size:18px}
  .step span{min-width:28px;text-align:center;font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .tip{font-size:14px;color:var(--muted);padding:10px 14px 0}
  .tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:10}
  .tabs button{flex:1;border-radius:0;background:none;color:var(--muted);padding:16px}
  .tabs button.active{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;z-index:20;max-width:90%}
  .toast.err{background:var(--danger);color:#fff}
  .item{display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
  .item.done .name{text-decoration:line-through;color:var(--muted)}
  .item input[type=checkbox]{width:24px;height:24px;margin-top:2px;accent-color:var(--accent)}
  .item .body{flex:1;min-width:0}
  .qtybadge{background:var(--soft);border-radius:8px;padding:2px 8px;font-weight:700}
  .hidden{display:none}
</style>
</head>
<body>

<header>
  <h1>🛒 Grocery List</h1>
  <div><small id="modeText">Helper</small> <button class="link" id="ownerBtn">Owner</button></div>
</header>

<main>
  <!-- PICK -->
  <section id="viewPick">
    <div class="filters">
      <input type="search" id="search" placeholder="Search items…" autocomplete="off">
      <div class="chips" id="chips"></div>
    </div>
    <div class="list" id="pickList"></div>
  </section>

  <!-- CART -->
  <section id="viewCart" class="hidden">
    <div class="list" id="cartBody"></div>
    <div id="ownerBar" class="list hidden" style="margin-top:14px">
      <button class="danger full" id="resetBtn">Reset cart (archive all)</button>
      <p class="tip" style="padding-left:0">Tick items as you buy them. Reset archives everything and starts a fresh list.</p>
    </div>
  </section>
</main>

<nav class="tabs">
  <button id="tabPick" class="active">＋ Pick items</button>
  <button id="tabCart">🛒 Cart <span id="cartCount"></span></button>
</nav>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============ CONFIG: paste your values from Supabase > Project Settings > API ============ */
const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
/* ======================================================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const catLabel = c => (c || "Other").replace(/ \(outside.*\)$/, "");

let role = "helper", pin = null, catalogue = [], categories = [], cart = [], activeCat = "All", view = "pick";

function toast(text, isErr){
  const t = $("toast"); t.textContent = text; t.classList.toggle("err", !!isErr); t.classList.remove("hidden");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), isErr ? 5000 : 1800);
}

/* ---------- OWNER MODE (PIN) ---------- */
function savedPin(){ try{ return localStorage.getItem("ownerPin"); }catch(e){ return null; } }
function storePin(p){ try{ p ? localStorage.setItem("ownerPin", p) : localStorage.removeItem("ownerPin"); }catch(e){} }
function applyMode(){
  role = pin ? "owner" : "helper";
  $("modeText").textContent = pin ? "Owner mode" : "Helper";
  $("ownerBtn").textContent = pin ? "Exit" : "Owner";
  renderCart();
}
$("ownerBtn").onclick = async () => {
  if(pin){ pin = null; storePin(null); applyMode(); return; }
  const p = prompt("Owner PIN:");
  if(!p) return;
  const { data, error } = await sb.rpc("check_owner_pin", { p_pin: p });
  if(error || !data){ alert("Wrong PIN."); return; }
  pin = p; storePin(p); applyMode();
};

/* ---------- TABS ---------- */
function setView(v){
  view = v;
  $("viewPick").classList.toggle("hidden", v !== "pick");
  $("viewCart").classList.toggle("hidden", v !== "cart");
  $("tabPick").classList.toggle("active", v === "pick");
  $("tabCart").classList.toggle("active", v === "cart");
  window.scrollTo(0, 0);
  if(v === "cart") loadCart();
}
$("tabPick").onclick = () => setView("pick");
$("tabCart").onclick = () => setView("cart");

/* ---------- PICK LIST ---------- */
function renderChips(){
  const all = ["All", ...categories];
  $("chips").innerHTML = all.map(c =>
    `<button class="chip ${c === activeCat ? "on" : ""}" data-cat="${esc(c)}">${esc(c === "All" ? "All" : catLabel(c))}</button>`).join("");
}
$("chips").onclick = e => {
  const b = e.target.closest("[data-cat]"); if(!b) return;
  activeCat = b.dataset.cat; renderChips(); renderPick(); window.scrollTo(0, 0);
};
$("search").oninput = renderPick;

function cartMap(){
  const m = {};
  cart.forEach(i => { if(!i.purchased && !(i.name in m)) m[i.name] = i; });
  return m;
}

function renderPick(){
  const term = $("search").value.trim().toLowerCase();
  const inCart = cartMap();
  let rows = catalogue.filter(c =>
    (activeCat === "All" || c.category === activeCat) &&
    (!term || c.name.toLowerCase().includes(term) || (c.brands||"").toLowerCase().includes(term)));
  let html = "";

  // custom item row when the search text isn't an exact catalogue name
  const raw = $("search").value.trim();
  if(raw && !catalogue.some(c => c.name.toLowerCase() === raw.toLowerCase())){
    const existing = inCart[raw];
    html += `<div class="cat">Not on the list?</div>` + rowHtml({ name: raw, category: null, brands: "Add as a new item", pack_sizes: "" }, existing, true);
  }

  let last = null;
  rows.forEach(c => {
    if(activeCat === "All" && c.category !== last){ html += `<div class="cat">${esc(catLabel(c.category))}</div>`; last = c.category; }
    html += rowHtml(c, inCart[c.name], false);
  });
  if(!rows.length && !raw) html = `<div class="empty">No items here.</div>`;
  $("pickList").innerHTML = html;
}

function rowHtml(c, ex, custom){
  const hint = [c.brands, c.pack_sizes && c.pack_sizes !== "–" ? c.pack_sizes : ""].filter(Boolean).join(" · ");
  const data = `data-name="${esc(c.name)}" data-cat="${esc(c.category || "")}"`;
  if(ex){
    return `<div class="p in"><div class="body"><div class="name">✓ ${esc(c.name)}</div>
      ${ex.note ? `<div class="note">📝 ${esc(ex.note)}</div>` : ""}
      <button class="link" data-act="note" data-id="${ex.id}">${ex.note ? "edit note" : "+ add note"}</button></div>
      <div class="step"><button data-act="dec" data-id="${ex.id}">−</button><span>${ex.qty}</span><button data-act="inc" data-id="${ex.id}">+</button></div></div>`;
  }
  return `<div class="p"><div class="body"><div class="name">${esc(c.name)}</div><div class="hint">${esc(hint)}</div></div>
    <button class="addbtn" data-act="add" ${data}>Add</button></div>`;
}

/* ---------- ACTIONS (shared by pick list and cart) ---------- */
async function act(e){
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const a = b.dataset.act, id = Number(b.dataset.id);
  const row = cart.find(i => i.id === id);
  b.disabled = true;
  let error = null;
  if(a === "add"){
    ({ error } = await sb.from("cart_items").insert({ name: b.dataset.name, category: b.dataset.cat || null, qty: 1 }));
    if(!error){ toast("Added " + b.dataset.name); if($("search").value && !catalogue.some(c => c.name === b.dataset.name)) $("search").value = ""; }
  } else if(a === "inc" && row){
    ({ error } = await sb.from("cart_items").update({ qty: Math.min(99, row.qty + 1) }).eq("id", id));
  } else if(a === "dec" && row){
    if(row.qty <= 1) ({ error } = await sb.from("cart_items").delete().eq("id", id));
    else ({ error } = await sb.from("cart_items").update({ qty: row.qty - 1 }).eq("id", id));
  } else if(a === "del"){
    if(!confirm("Remove this item from the list?")){ b.disabled = false; return; }
    ({ error } = await sb.from("cart_items").delete().eq("id", id));
  } else if(a === "note" && row){
    const n = prompt("Note (max 100 characters):", row.note || "");
    if(n === null){ b.disabled = false; return; }
    ({ error } = await sb.from("cart_items").update({ note: n.trim().slice(0, 100) || null }).eq("id", id));
  }
  if(error) toast(error.message, true);
  await loadCart();
}
$("pickList").onclick = act;
$("cartBody").onclick = act;

/* ---------- CART ---------- */
async function loadCart(){
  const { data, error } = await sb.from("cart_items").select("*").eq("archived", false).order("added_at");
  if(error) return;
  cart = data || [];
  $("cartCount").textContent = cart.length ? `(${cart.length})` : "";
  renderPick(); renderCart();
}
function renderCart(){
  const body = $("cartBody");
  $("ownerBar").classList.toggle("hidden", !(role === "owner" && cart.length));
  if(!cart.length){ body.innerHTML = `<div class="empty">The cart is empty.<br>Go to “Pick items” to add some.</div>`; return; }
  const groups = {};
  cart.forEach(i => (groups[i.category || "Other"] ||= []).push(i));
  const order = Object.keys(groups).sort((a, b) => (categories.indexOf(a) + 1 || 99) - (categories.indexOf(b) + 1 || 99));
  let html = "";
  order.forEach(cat => {
    html += `<div class="cat">${esc(catLabel(cat))}</div>`;
    groups[cat].forEach(i => {
      html += `<div class="item ${i.purchased ? "done" : ""}">
        ${role === "owner" ? `<input type="checkbox" data-tick="${i.id}" ${i.purchased ? "checked" : ""}>` : ""}
        <div class="body"><div class="name">${esc(i.name)}</div>
          ${i.note ? `<div class="hint" style="white-space:normal">📝 ${esc(i.note)}</div>` : ""}
          ${!i.purchased ? `<button class="link" data-act="note" data-id="${i.id}">${i.note ? "edit note" : "+ add note"}</button>` : ""}
        </div>
        ${i.purchased ? `<span class="qtybadge">×${i.qty}</span>` :
          `<div class="step"><button data-act="dec" data-id="${i.id}">−</button><span>${i.qty}</span><button data-act="inc" data-id="${i.id}">+</button></div>`}
      </div>`;
    });
  });
  body.innerHTML = html;
  body.querySelectorAll("[data-tick]").forEach(cb => cb.onchange = async () => {
    const { error } = await sb.rpc("owner_set_purchased", { p_pin: pin, p_id: Number(cb.dataset.tick), p_value: cb.checked });
    if(error) toast(error.message, true);
    loadCart();
  });
}
$("resetBtn").onclick = async () => {
  const left = cart.filter(i => !i.purchased).length;
  const msg = left ? `${left} item(s) are not ticked off. Archive everything and reset the cart anyway?` : "Archive all items and reset the cart?";
  if(!confirm(msg)) return;
  const { error } = await sb.rpc("owner_reset_cart", { p_pin: pin });
  if(error){ toast(error.message, true); return; }
  toast("Cart reset. Items archived.");
  loadCart();
};

/* ---------- START ---------- */
(async function start(){
  if(SUPABASE_URL.includes("YOUR-PROJECT-REF") || SUPABASE_ANON_KEY.includes("YOUR-ANON")){
    $("pickList").innerHTML = `<div class="empty"><b>Setup needed:</b> the Supabase URL and key in index.html have not been filled in.</div>`; return;
  }
  const cat = await sb.from("catalogue").select("*").order("id");
  if(cat.error){
    $("pickList").innerHTML = `<div class="empty"><b>Couldn't load the list.</b><br>${esc(cat.error.message)}<br><small>Check the URL and key in index.html, and that setup.sql was run.</small></div>`; return;
  }
  catalogue = cat.data || [];
  if(!catalogue.length){
    $("pickList").innerHTML = `<div class="empty"><b>The list is empty.</b><br>Connected to Supabase, but the catalogue table has no rows (or the read permission is missing). Re-run setup.sql.</div>`; return;
  }
  catalogue.forEach(c => { if(!categories.includes(c.category)) categories.push(c.category); });
  const sp = savedPin();
  if(sp){ const { data } = await sb.rpc("check_owner_pin", { p_pin: sp }); if(data) pin = sp; else storePin(null); }
  renderChips();
  applyMode();
  await loadCart();
  setInterval(loadCart, 30000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) loadCart(); });
})();
</script>
</body>
</html>
